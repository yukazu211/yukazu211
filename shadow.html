<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>太陽方位・影シミュレーター</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f5f7fa;
    padding: 16px;
  }
  h2 {
    margin-bottom: 8px;
  }
  .controls {
    margin-bottom: 12px;
  }
  label {
    font-size: 14px;
  }
  input[type="range"] {
    width: 100%;
  }
  button {
    padding: 6px;
    font-size: 14px;
  }
  canvas {
    display: block;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .info {
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>太陽方位・影シミュレーター</h2>

<div class="controls">
  <label>
    緯度
    <input id="lat" type="number" step="0.0001" value="34.9667">
  </label>

  <div style="width:100vw">
    <label> 
    経度
    <input id="lon" type="number" step="0.0001" value="138.3833">
  </label>
  </div>

  <label>
    日付
    <input id="daySlider" type="range" min="0" max="364">
    <div id="dayLabel"></div>
  </label>

  <label>
    時刻
    <input id="timeSlider" type="range" min="0" max="1440" step="1">
    <div id="timeLabel"></div>
  </label>

  <button onclick="useCurrentLocation()">現在地を取得</button>
</div>
<div class="info" id="info"></div>
<canvas id="canvas" width="420" height="420"></canvas>



<script>
/* ================= 設定値 ================= */
const BUILDING_HEIGHT = 10;       // 建物高さ（m）
const SUNSET_ALT = -0.833;        // 日の出・日の入り定義
const EDGE_RANGE = 0.4;           // 点線判定幅
const SHADOW_MAX = 1000;           // 影の最大長（m）
const PX_PER_M = 2;                // 1mあたりのpx
const baseYear = new Date().getFullYear();

/* ================= DOM ================= */
const latInput = document.getElementById("lat");
const lonInput = document.getElementById("lon");
const daySlider = document.getElementById("daySlider");
const timeSlider = document.getElementById("timeSlider");
const dayLabel = document.getElementById("dayLabel");
const timeLabel = document.getElementById("timeLabel");
const canvas = document.getElementById("canvas");
const info = document.getElementById("info");
const ctx = canvas.getContext("2d");

/* ================= 太陽位置計算 ================= */
function getSunPosition(date, lat, lon) {
  const rad = Math.PI / 180;

  const start = Date.UTC(date.getUTCFullYear(), 0, 0);
  const day = (date.getTime() - start) / 86400000;

  const time =
    date.getUTCHours() +
    date.getUTCMinutes() / 60 +
    date.getUTCSeconds() / 3600;

  const gamma = 2 * Math.PI / 365 * (day - 1 + (time - 12) / 24);

  const decl =
    0.006918
    - 0.399912 * Math.cos(gamma)
    + 0.070257 * Math.sin(gamma)
    - 0.006758 * Math.cos(2 * gamma)
    + 0.000907 * Math.sin(2 * gamma);

  const eqtime =
    229.18 * (
      0.000075
      + 0.001868 * Math.cos(gamma)
      - 0.032077 * Math.sin(gamma)
      - 0.014615 * Math.cos(2 * gamma)
      - 0.040849 * Math.sin(2 * gamma)
    );

  const tst = time * 60 + eqtime + 4 * lon;
  const ha = (tst / 4 - 180) * rad;
  const latRad = lat * rad;

  const altitude = Math.asin(
    Math.sin(latRad) * Math.sin(decl) +
    Math.cos(latRad) * Math.cos(decl) * Math.cos(ha)
  );

  const azimuth = Math.atan2(
    Math.sin(ha),
    Math.cos(ha) * Math.sin(latRad) - Math.tan(decl) * Math.cos(latRad)
  );

  return {
    altitude: altitude / rad,
    azimuth: (azimuth / rad + 180) % 360
  };
}

/* ================= 影の長さ ================= */
function getShadowLength(alt) {
  if (alt <= 0) return null;
  const rad = Math.PI / 180;
  return Math.min(BUILDING_HEIGHT / Math.tan(alt * rad), SHADOW_MAX);
}

/* ================= 描画 ================= */
function draw(pos) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 方位円
  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(cx, cy, 170, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#555";
  ctx.fillText("N", cx - 5, cy - 185);
  ctx.fillText("E", cx + 180, cy + 5);
  ctx.fillText("S", cx - 5, cy + 195);
  ctx.fillText("W", cx - 195, cy + 5);

  const rad = Math.PI / 180;
  const angle = (pos.azimuth - 90) * rad;

  const isEdge = Math.abs(pos.altitude - SUNSET_ALT) <= EDGE_RANGE;
  const canDrawSun = pos.altitude > 0;

  ctx.setLineDash(isEdge ? [6, 6] : []);

  if (canDrawSun) {
    // 太陽方向
    ctx.strokeStyle = "orange";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(
      cx + Math.cos(angle) * 150,
      cy + Math.sin(angle) * 150
    );
    ctx.stroke();

    // 影
    const shadow = getShadowLength(pos.altitude);
    if (shadow !== null) {
      const px = shadow * PX_PER_M;
      ctx.strokeStyle = "#444";
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(
        cx - Math.cos(angle) * px,
        cy - Math.sin(angle) * px
      );
      ctx.stroke();
    }
  }

  ctx.setLineDash([]);

  // 中心点
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
}

/* ================= UI更新 ================= */
function updateFromSlider() {
  const lat = parseFloat(latInput.value);
  const lon = parseFloat(lonInput.value);

  const date = new Date(baseYear, 0, 1);
  date.setDate(date.getDate() + Number(daySlider.value));

  const minutes = Number(timeSlider.value);
  date.setHours(Math.floor(minutes / 60), minutes % 60, 0);

  dayLabel.textContent =
    `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
  timeLabel.textContent =
    `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;

  const pos = getSunPosition(date, lat, lon);
  draw(pos);

  let state = "昼";
  if (pos.altitude <= 0 && pos.altitude > -6) state = "日の出・日の入り（薄明）";
  if (pos.altitude <= -6) state = "夜";

  const shadow = getShadowLength(pos.altitude);

  info.textContent =
    `状態: ${state} / 方位角 ${pos.azimuth.toFixed(1)}° / 高度 ${pos.altitude.toFixed(1)}°` +
    (shadow ? ` / 影の長さ 約${shadow.toFixed(1)}m（建物10m）` : "");
}

/* ================= 現在地取得 ================= */
function useCurrentLocation() {
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(pos => {
    latInput.value = pos.coords.latitude.toFixed(6);
    lonInput.value = pos.coords.longitude.toFixed(6);
    updateFromSlider();
  });
}

/* ================= 初期化 ================= */
const now = new Date();
daySlider.value = Math.floor((now - new Date(baseYear, 0, 1)) / 86400000);
timeSlider.value = now.getHours() * 60 + now.getMinutes();

["input", "change"].forEach(e => {
  daySlider.addEventListener(e, updateFromSlider);
  timeSlider.addEventListener(e, updateFromSlider);
  latInput.addEventListener(e, updateFromSlider);
  lonInput.addEventListener(e, updateFromSlider);
});

updateFromSlider();

</script>

</body>
</html>
